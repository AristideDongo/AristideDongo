name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AristideDongo
          filename: github-metrics.svg
          template: classic
          config_timezone: Africa/Abidjan
          config_display: regular # largeur compacte (480 px)

          # Sections de base allégées (sans le pied de page "metadata")
          base: header, repositories

          # Langages les plus utilisés
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, shell, dockerfile

          # Habitudes de code : faits seulement (les graphiques plantaient)
          plugin_habits: yes
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no

          # Calendrier isométrique des contributions
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
