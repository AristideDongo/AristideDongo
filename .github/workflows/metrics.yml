name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Personal access token (classic) avec les scopes : read:user, repo (optionnel pour les repos privés)
          token: ${{ secrets.METRICS_TOKEN }}
          user: AristideDongo
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Abidjan

          # Calendrier isométrique des contributions
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Langages les plus utilisés
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, shell, dockerfile

          # Habitudes de code (heures / jours de commit)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          # Score PageSpeed du portfolio
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://aristided.vercel.app
